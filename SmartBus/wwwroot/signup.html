<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Sign Up</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="./css/loginsignup.css">
</head>

<body>
    <div class="container">
        <button type="button" onclick="location.href='./index.html'">Pocetna</button>
        <h1 class="logo">SMARTBUS</h1>
        <h2 id="title">Sign Up</h2>

        <form id="form" method="POST" action="">
            <input type="text" name="ime" placeholder="Ime" required>
            <input type="text" name="prezime" placeholder="Prezime" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="confirm" placeholder="Confirm Password" required>
            <button type="submit">Register</button>
        </form>
        <div id="message" style="margin-top: 12px; text-align: center;"></div>
        <div class="no-acc">
            Imas nalog? <a href="./login.html" class="link">Uloguj se</a>
        </div>
    </div>
    <script type="module" src="./js/signup.js"></script>
</body>

</html>
