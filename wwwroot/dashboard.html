<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBus - Dashboard</title>
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</head>

<body>
    <header class="dashboard-header">
        <div class="brand">
            <h1>SMARTBUS</h1>
            <p>Dobrodošli nazad!</p>
        </div>
        <nav class="header-actions">
            <div class="notification-div">
                <div class="bell" id="bell"><i class="fa-solid fa-bell"></i></div>
                <div class="notifications hidden" id="notifications"></div>
            </div>
            <div class="header-right">
                <button onclick="location.href='./karte.html'"><i class="fa-solid fa-list"></i>  Lista Karata</button>
                <button class="btn-odjava"><i class="fa-solid fa-arrow-right-from-bracket"></i> Odjava</button>
            </div>
        </nav>
    </header>

    <main class="dashboard-grid">
        <section class="profile-card">
            <h2>Vaš profil</h2>
            <p class="profile-welcome">Dobrodošli, <span class="user-name">Korisniče</span>!</p>
            <ul>
                <li>Email: <span class="user-email">example@mail.com</span></li>
                <li>Tip korisnika: <span class="user-role">Putnik</span></li>
            </ul>
            <button onclick="location.href='./profile.html'"><i class="fa-solid fa-user"></i>    Uredi profil</button>
        </section>

        <section class="search-panel">
            <h2>Pretraga prevoznika</h2>
            <div class="filters">
                <label>
                    Grad polaska

                    <select id="filter-departure" class="select2"></select>
                </label>
                <div class="swap-wrapper">
                    <button class="swap-cities" id="swap-btn">
                        <i class="fa-solid fa-arrow-right-arrow-left"></i>
                    </button>
                </div>
                <label>
                    Grad dolaska
                    <select id="filter-arrival"></select>
                </label>
                <label>
                    Datum
                    <input type="date" id="filter-date">
                </label>
                <label>
                    Minimalna ocena
                    <div class="rating-filter">

                        <i class="fa-regular fa-star"></i>
                        <i class="fa-regular fa-star"></i>
                        <i class="fa-regular fa-star"></i>
                        <i class="fa-regular fa-star"></i>
                        <i class="fa-regular fa-star"></i>
                    </div>
                </label>
            </div>
            <button id="apply-filters"><i class="fa-solid fa-filter"></i>  Primeni filtere</button>
        </section>

        <section class="polasci-list">
            <h2>Lista prevoznika</h2>
            <div id="polasci-container" class="cards-grid">

            </div>
        </section>
    </main>
    <script type="module" src="./js/apiService.js"></script>
    <script type="module" src="./js/dashboard.js"></script>
</body>

</html>
